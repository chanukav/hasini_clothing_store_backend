name: Build & Deploy Backend to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hasini-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hasini-backend:${{ github.sha }}

      - name: Deploy to AWS EC2 via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting Backend deployment on AWS EC2 via Docker Compose..."
            mkdir -p ~/app
            cd ~/app

            # Write or update backend environment variables
            echo "PORT=5000" > .env.backend
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env.backend
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.backend
            echo "PAYHERE_MERCHANT_ID=${{ secrets.PAYHERE_MERCHANT_ID }}" >> .env.backend
            echo "PAYHERE_SECRET=${{ secrets.PAYHERE_SECRET }}" >> .env.backend

            # Ensure docker-compose.yml exists
            if [ ! -f docker-compose.yml ]; then
              echo "services:" > docker-compose.yml
              echo "  backend:" >> docker-compose.yml
              echo "    image: ${{ secrets.DOCKERHUB_USERNAME }}/hasini-backend:latest" >> docker-compose.yml
              echo "    container_name: hasini-backend" >> docker-compose.yml
              echo "    restart: always" >> docker-compose.yml
              echo "    ports:" >> docker-compose.yml
              echo "      - '5000:5000'" >> docker-compose.yml
              echo "    env_file:" >> docker-compose.yml
              echo "      - .env.backend" >> docker-compose.yml
              echo "  frontend:" >> docker-compose.yml
              echo "    image: ${{ secrets.DOCKERHUB_USERNAME }}/hasini-frontend:latest" >> docker-compose.yml
              echo "    container_name: hasini-frontend" >> docker-compose.yml
              echo "    restart: always" >> docker-compose.yml
              echo "    ports:" >> docker-compose.yml
              echo "      - '80:80'" >> docker-compose.yml
              echo "    depends_on:" >> docker-compose.yml
              echo "      - backend" >> docker-compose.yml
            fi

            # Explicitly pull latest image to local Docker daemon
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/hasini-backend:latest

            # Update and restart only the backend container with zero downtime
            docker compose up -d --no-deps backend

            # Clean up dangling images to save disk space
            docker image prune -f

            echo "Backend successfully deployed with Docker Compose!"
