services:
  backend:
    image: ${DOCKERHUB_USERNAME:-chanukav}/hasini-backend:latest
    container_name: hasini-backend
    restart: always
    expose:
      - "5000"
    env_file:
      - .env.backend
    environment:
      - VIRTUAL_HOST=api.hasaniclothingstore.chanukavithanage.com
      - LETSENCRYPT_HOST=api.hasaniclothingstore.chanukavithanage.com
      - VIRTUAL_PORT=5000
    networks:
      - app-network

  frontend:
    image: ${DOCKERHUB_USERNAME:-chanukav}/hasini-frontend:latest
    container_name: hasini-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    environment:
      - VIRTUAL_HOST=hasaniclothingstore.chanukavithanage.com
      - LETSENCRYPT_HOST=hasaniclothingstore.chanukavithanage.com
      - VIRTUAL_PORT=80
    networks:
      - app-network

  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: always
    networks:
      - app-network

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    environment:
      - DEFAULT_EMAIL=chanukavithanage129@gmail.com
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/etc/acme.sh
    restart: always
    depends_on:
      - nginx-proxy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  conf:
  vhost:
  html:
  certs:
  acme:
